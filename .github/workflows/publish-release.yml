---
name: Publish Release
permissions:
  contents: write

concurrency:
  group: publish

on:
  push:
    tags:
      - "v*"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Check
      run: bun run check
    - name: Publish npm package
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        if npm view "beeper-cli@${version}" version >/dev/null 2>&1; then
          echo "beeper-cli@${version} is already published"
          exit 0
        fi
        npm version "${version}" --workspace beeper-cli --no-git-tag-version --allow-same-version
        npm publish --workspace beeper-cli --access public
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        if ! gh release view "${tag}" >/dev/null 2>&1; then
          gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag
        fi
